version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: zingbite-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  backend:
    build: ./Backend
    container_name: zingbite-backend
    ports:
      - "4000:4000"
    env_file:
      - ./Backend/.env
    environment:
      - REDIS_URL=redis://redis:6379
      - REDIS_ENABLED=true
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    build: ./Frontend
    container_name: zingbite-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:4000/api
      - VITE_SOCKET_URL=http://localhost:4000
    depends_on:
      - backend
    restart: unless-stopped

